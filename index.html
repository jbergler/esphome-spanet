<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eSPA Mini v1 Installer</title>
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 640px;
      margin: 3rem auto;
      padding: 0 1.5rem;
      color: #222;
    }
    h1 { margin-bottom: 0.25rem; }
    .version { color: #666; font-size: 0.9rem; margin-bottom: 2rem; }
    esp-web-install-button { display: block; margin: 1.5rem 0; }
    footer { margin-top: 3rem; font-size: 0.8rem; color: #888; }
  </style>
</head>
<body>
  <h1>eSPA Mini v1</h1>
  <p class="version">Version 0.1.0</p>
  <p>Connect your ESP32-S3 via USB, then click <strong>Install</strong>.</p>
  <esp-web-install-button manifest="manifest.json"></esp-web-install-button>
  <footer>
    Requires Chrome or Edge with Web Serial support.
    <a href="https://github.com/jbergler/esphome-spanet">Source on GitHub</a>
  </footer>
</body>
</html>
