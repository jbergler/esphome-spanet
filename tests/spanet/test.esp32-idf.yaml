esphome:
  name: spanet-dummy
  friendly_name: SpaNET Dummy

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

uart:
  id: spa_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 38400

external_components:
  - source:
      type: local
      path: ../../components

spanet:
  id: spa_hub
  uart_id: spa_uart

text_sensor:
  - platform: spanet
    spanet_id: spa_hub
    controller_model:
      name: "SpaNET Controller Model"
    controller_serial:
      name: "SpaNET Controller Serial"
    controller_fw_version:
      name: "SpaNET Controller FW Version"
