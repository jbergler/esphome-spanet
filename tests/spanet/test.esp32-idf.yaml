esphome:
  name: spanet-dummy
  friendly_name: SpaNET Dummy

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

uart:
  id: spa_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 38400

output:
  - platform: gpio
    id: status_led
    pin: GPIO2

external_components:
  - source:
      type: local
      path: ../../components

spanet:
  id: spa_hub
  uart_id: spa_uart
  status:
    led: status_led

text_sensor:
  - platform: spanet
    spanet_id: spa_hub
    controller_model:
      name: "SpaNET Controller Model"
    controller_serial:
      name: "SpaNET Controller Serial"
    controller_fw_version:
      name: "SpaNET Controller FW Version"
    current_time:
      name: "SpaNET Current Time"

sensor:
  - platform: spanet
    spanet_id: spa_hub
    water_temperature:
      name: "SpaNET Water Temperature"
    setpoint_temperature:
      name: "SpaNET Setpoint Temperature"
    heater_temperature:
      name: "SpaNET Heater Temperature"
    case_temperature:
      name: "SpaNET Case Temperature"
    mains_voltage:
      name: "SpaNET Mains Voltage"
    mains_current:
      name: "SpaNET Mains Current"
    instant_power:
      name: "SpaNET Instant Power"
    total_energy:
      name: "SpaNET Total Energy"

climate:
  - platform: spanet
    spanet_id: spa_hub
    name: "SpaNET Climate"

fan:
  - platform: spanet
    spanet_id: spa_hub
    pump: 1
    name: "SpaNET Pump 1"
  - platform: spanet
    spanet_id: spa_hub
    pump: 2
    name: "SpaNET Pump 2"
  - platform: spanet
    spanet_id: spa_hub
    pump: 3
    name: "SpaNET Pump 3"
  - platform: spanet
    spanet_id: spa_hub
    pump: 4
    name: "SpaNET Pump 4"
  - platform: spanet
    spanet_id: spa_hub
    pump: 5
    name: "SpaNET Pump 5"

light:
  - platform: spanet
    spanet_id: spa_hub
    name: "SpaNET Light"

select:
  - platform: spanet
    spanet_id: spa_hub
    light_effect:
      name: "SpaNET Light Effect"
    operating_mode:
      name: "SpaNET Operating Mode"
    sleep_timer_1_day:
      name: "SpaNET Sleep Timer 1 Active Days"
    sleep_timer_2_day:
      name: "SpaNET Sleep Timer 2 Active Days"

number:
  - platform: spanet
    spanet_id: spa_hub
    light_effect_speed:
      name: "SpaNET Light Effect Speed"
    filtration_hours:
      name: "SpaNET Filtration Hours"
    filtration_block_hours:
      name: "SpaNET Filtration Block Duration"
    sleep_timer_1_begin_hour:
      name: "SpaNET Sleep Timer 1 Begin Hour"
    sleep_timer_1_begin_minute:
      name: "SpaNET Sleep Timer 1 Begin Minute"
    sleep_timer_1_end_hour:
      name: "SpaNET Sleep Timer 1 End Hour"
    sleep_timer_1_end_minute:
      name: "SpaNET Sleep Timer 1 End Minute"
    sleep_timer_2_begin_hour:
      name: "SpaNET Sleep Timer 2 Begin Hour"
    sleep_timer_2_begin_minute:
      name: "SpaNET Sleep Timer 2 Begin Minute"
    sleep_timer_2_end_hour:
      name: "SpaNET Sleep Timer 2 End Hour"
    sleep_timer_2_end_minute:
      name: "SpaNET Sleep Timer 2 End Minute"

binary_sensor:
  - platform: spanet
    spanet_id: spa_hub
    heating_active:
      name: "SpaNET Heating Active"
    ozone_active:
      name: "SpaNET Ozone Active"
    clean_cycle_active:
      name: "SpaNET Clean Cycle Active"
    water_present:
      name: "SpaNET Water Present"
