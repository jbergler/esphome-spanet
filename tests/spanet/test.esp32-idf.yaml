esphome:
  name: spanet-dummy
  friendly_name: SpaNET Dummy

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

uart:
  id: spa_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 38400

external_components:
  - source:
      type: local
      path: ../../components

spanet:
  id: spa_hub
  uart_id: spa_uart

text_sensor:
  - platform: spanet
    spanet_id: spa_hub
    controller_model:
      name: "SpaNET Controller Model"
    controller_serial:
      name: "SpaNET Controller Serial"
    controller_fw_version:
      name: "SpaNET Controller FW Version"

sensor:
  - platform: spanet
    spanet_id: spa_hub
    water_temperature:
      name: "SpaNET Water Temperature"
    setpoint_temperature:
      name: "SpaNET Setpoint Temperature"
    heater_temperature:
      name: "SpaNET Heater Temperature"
    case_temperature:
      name: "SpaNET Case Temperature"
    mains_voltage:
      name: "SpaNET Mains Voltage"
    mains_current:
      name: "SpaNET Mains Current"
    instant_power:
      name: "SpaNET Instant Power"
    total_energy:
      name: "SpaNET Total Energy"

climate:
  - platform: spanet
    spanet_id: spa_hub
    name: "SpaNET Climate"

fan:
  - platform: spanet
    spanet_id: spa_hub
    pump: 1
    name: "SpaNET Pump 1"
  - platform: spanet
    spanet_id: spa_hub
    pump: 2
    name: "SpaNET Pump 2"
  - platform: spanet
    spanet_id: spa_hub
    pump: 3
    name: "SpaNET Pump 3"
  - platform: spanet
    spanet_id: spa_hub
    pump: 4
    name: "SpaNET Pump 4"
  - platform: spanet
    spanet_id: spa_hub
    pump: 5
    name: "SpaNET Pump 5"
