esphome:
  name: spanet-dummy
  friendly_name: SpaNET Dummy

host:
  mac_address: "06:35:69:ab:f6:79"

logger:
  level: VERBOSE

uart:
  id: spa_uart
  port: /dev/ttys003
  baud_rate: 38400

external_components:
  - source:
      type: local
      path: ../../components

spanet:
  id: spa_hub
  uart_id: spa_uart

text_sensor:
  - platform: spanet
    spanet_id: spa_hub
    controller_model:
      name: "SpaNET Controller Model"
    controller_serial:
      name: "SpaNET Controller Serial"
    controller_fw_version:
      name: "SpaNET Controller FW Version"
